name: Static Code Analysis (SonarQube / SonarCloud)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Harus 0 agar SonarQube dapat hitung blame/line history

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Run Flutter static analysis (flutter analyze)
        run: flutter analyze --machine > flutter_analyze_report.json || true

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Convert LCOV to Cobertura XML
        run: |
          pip install lcov-cobertura
          python -m lcov_cobertura coverage/lcov.info -o coverage/cobertura-coverage.xml

      - name: SonarQube Scan
        uses: sonarsource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
