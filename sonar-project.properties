# =============================================================================
# SonarQube / SonarCloud project configuration
# Project: Onderdil Motor Indonesia (Flutter + Supabase)
# Mata Kuliah: Analisis & Pengujian Sistem (IF7A)
# =============================================================================

# --- Project identification --------------------------------------------------
sonar.projectKey=azfnva_OnderdilMotorIndonesia
sonar.projectName=Onderdil Motor Indonesia
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# --- Source & test directories ----------------------------------------------
sonar.sources=lib
sonar.tests=test

# --- Exclusions (build artifacts, platform folders, generated code, config) --
sonar.exclusions=build/**, android/**, ios/**, web/**, windows/**, macos/**, linux/**, .dart_tool/**, .idea/**, **/*.g.dart, **/*.freezed.dart, **/*.config.dart, config/**, test/bdd/**

# --- Dart static analysis report --------------------------------------------
# Di-generate oleh: flutter analyze --machine > flutter_analyze_report.json
sonar.dart.analysisReportPath=flutter_analyze_report.json

# --- Coverage report ---------------------------------------------------------
# Di-generate oleh: flutter test --coverage + konversi LCOV ke Sonar generic XML
sonar.coverageReportPaths=coverage/sonar-coverage.xml

# --- SonarCloud (SaaS SonarQube) --------------------------------------------
sonar.organization=azfnva
sonar.host.url=https://sonarcloud.io
